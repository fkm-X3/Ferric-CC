[package]
name = "ferric-cc"
version = "0.0.0" # Not ready, therefore 0.0.0 not 0.1.0
edition = "2021"
description = "Ferric-CC, a C compiler targeting x86-64, i686, ARM64, and RISC-V"
autobins = false

[[bin]]
name = "ferric-cc"
path = "src/main.rs"

[[bin]]
name = "ferric-cc-x86"
path = "src/bin/ferric_cc_x86.rs"

[[bin]]
name = "ferric-cc-arm"
path = "src/bin/ferric_cc_arm.rs"

[[bin]]
name = "ferric-cc-riscv"
path = "src/bin/ferric_cc_riscv.rs"

[[bin]]
name = "ferric-cc-i686"
path = "src/bin/ferric_cc_i686.rs"

[features]
# Allow GCC as a linker fallback. When enabled and GCC is used, a warning is printed.
gcc_linker = []
# Allow GCC as an assembler fallback. When enabled and GCC is used, a warning is printed.
gcc_assembler = []
# Allow GCC passthrough for -m16 mode (16-bit real-mode boot code).
# When enabled and GCC is used, a prominent warning is printed.
gcc_m16 = []
